[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.149.1"

# 1. Redirect Old Netlify Subdomain (THE FIX for your GSC error)
[[redirects]]
  from = "https://ahbeefab.netlify.app/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

# 2. Redirect non-HTTPS (HTTP) to HTTPS & www
[[redirects]]
  from = "http://ahbeefabrication.com.au/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

[[redirects]]
  from = "http://www.ahbeefabrication.com.au/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

# Netlify Forms and environment settings
[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL"