[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.149.1"

# ====== CRITICAL: CANONICAL DOMAIN SETUP ======
# 1. Force HTTPS on your primary domain
[[redirects]]
  from = "http://ahbeefabrication.com.au/*"
  to = "https://ahbeefabrication.com.au/:splat"
  status = 301
  force = true

# 2. Handle www version (Option A: Remove www)
[[redirects]]
  from = "https://www.ahbeefabrication.com.au/*"
  to = "https://ahbeefabrication.com.au/:splat"
  status = 301
  force = true

# ====== OLD DOMAIN REDIRECTS ======
[[redirects]]
  from = "http://ahbeefab.netlify.app/*"
  to = "https://ahbeefabrication.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ahbeefab.netlify.app/*"
  to = "https://ahbeefabrication.com.au/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://www.googletagmanager.com; font-src 'self'; connect-src 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Special header for sitemap.xml
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

