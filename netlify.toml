[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.149.1"

# 1. CANONICAL REDIRECTS (MOST IMPORTANT)
[[redirects]]
  from = "http://ahbeefabrication.com.au/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

[[redirects]]
  from = "http://www.ahbeefabrication.com.au/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

[[redirects]]
  from = "https://ahbeefabrication.com.au/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

# 2. OLD NETLIFY APP DOMAIN REDIRECT
[[redirects]]
  from = "https://ahbeefab.netlify.app/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

# 3. TRAILING SLASH HANDLING
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

# Netlify Forms and environment settings
[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL"
