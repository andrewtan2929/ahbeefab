[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.149.1"

# 1. Redirect Old Netlify Domain to WWW (Fixes your GSC error)
[[redirects]]
  from = "https://ahbeefab.netlify.app/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

# 2. Redirect non-WWW to WWW (Netlify handles this, but this ensures it)
[[redirects]]
  from = "https://ahbeefabrication.com.au/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

# 3. Redirect HTTP to HTTPS (Essential for security)
[[redirects]]
  from = "http://ahbeefabrication.com.au/*"
  to = "https://www.ahbeefabrication.com.au/:splat"
  status = 301

[context.production.environment]
  HUGO_ENV = "production"